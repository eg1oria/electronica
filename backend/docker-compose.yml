name: electronica

services:
  postgres:
    image: postgres:17-alpine
    container_name: electronica-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: electronica
      POSTGRES_PASSWORD: electronica
      POSTGRES_DB: electronica
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
