# Только база для локальной разработки: npm run db:up / npm run db:down.
# API и витрина в этом случае запускаются на хосте (npm run start:dev).
#
# Весь стек в Docker (база + миграции + API + витрина + nginx) —
# docker-compose.yml в корне репозитория.

name: electronica

services:
  postgres:
    image: postgres:17-alpine
    container_name: electronica-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-electronica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-electronica}
      POSTGRES_DB: ${POSTGRES_DB:-electronica}
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
