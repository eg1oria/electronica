user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Реальный IP клиента — из X-Forwarded-For, если перед nginx есть ещё прокси
    # (Cloudflare и т.п.). Без внешнего прокси строку set_real_ip_from не трогаем.
    # set_real_ip_from  173.245.48.0/20;
    # real_ip_header    X-Forwarded-For;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Фото товара — до 5 МБ, плюс запас на multipart и служебные поля.
    client_max_body_size 10m;
    client_body_timeout  30s;
    client_header_timeout 15s;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/rss+xml
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Защита от перебора: общий лимит на API и жёсткий — на вход в админку.
    limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
