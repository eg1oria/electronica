# Общие заголовки для проксирования на web и api.
proxy_http_version 1.1;
proxy_set_header Connection "";

# $http_host, а не $host: сохраняет нестандартный порт (localhost:8099).
# Next.js сверяет Origin с X-Forwarded-Host и без порта отклоняет
# Server Actions — «Invalid Server Actions request».
proxy_set_header Host              $http_host;
proxy_set_header X-Forwarded-Host  $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Port  $server_port;

# Потоковый рендеринг (Suspense) — отдаём ответ по мере готовности.
proxy_buffering off;

proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
