# HTTP-конфигурация: сайт, API и фото на одном домене.
# HTTPS: см. app-ssl.conf.example рядом (DEPLOY.md, раздел «HTTPS»).

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    # Проверка домена для Let's Encrypt (certbot --webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    # Для docker healthcheck самого nginx.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # Фото товаров лежат в общем томе с API — отдаём с диска, мимо Node.
    # Имена файлов — uuid, содержимое не меняется, поэтому immutable.
    location ^~ /uploads/ {
        root /var/www;
        access_log off;
        # Только add_header: директива expires добавила бы второй Cache-Control.
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri @api_uploads;
    }

    # Файла нет на диске (общий том ещё не смонтирован) — спросим у API.
    location @api_uploads {
        proxy_pass http://api;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Вход в админку — отдельный, более строгий лимит.
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://api;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Сборка Next: имена с хэшем, заголовки кэширования ставит сам Next.
    location ^~ /_next/static/ {
        proxy_pass http://web;
        include /etc/nginx/snippets/proxy.conf;
        access_log off;
    }

    location / {
        proxy_pass http://web;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
